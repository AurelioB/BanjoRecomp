plugins {
    id 'com.android.application'
}

final String homeDir = System.getenv('HOME') ?: System.getProperty('user.home')
final String androidSdk = (System.getenv('ANDROID_HOME') ?: {
    String defaultSdk = "${homeDir}/Android/Sdk"
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        String appDataSdk = "${System.getenv('LOCALAPPDATA')}/Android/Sdk"
        if (!new File(defaultSdk).exists() && new File(appDataSdk).exists()) {
            return appDataSdk
        }
    }
    return defaultSdk
}.call()).replace('\\', '/')
final String androidNdk = (System.getenv('ANDROID_NDK_HOME') ?: "${androidSdk}/ndk/28.2.13676358").replace('\\', '/')
final String sdl2Prefix = (System.getenv('BANJO_ANDROID_SDL2_PREFIX') ?: "${homeDir}/Android/prefixes/SDL2-2.32.10-android-arm64").replace('\\', '/')
final String freetypePrefix = (System.getenv('BANJO_ANDROID_FREETYPE_PREFIX') ?: "${homeDir}/Android/prefixes/freetype-2.13.3-android-arm64").replace('\\', '/')
final String defaultDevRomDir = System.getenv('BANJO_ANDROID_DEV_ROM_DIR') ?: project.findProperty('banjoDevRomDir') ?: rootProject.projectDir.parentFile.absolutePath
final String bundledBaserom = System.getenv('BANJO_ANDROID_BASEROM') ?: new File(defaultDevRomDir, 'lib/bk-decomp/baserom.us.v10.z64').absolutePath
final String bundledDecompressedRom = System.getenv('BANJO_ANDROID_DECOMPRESSED_ROM') ?: new File(defaultDevRomDir, 'banjo.us.v10.decompressed.z64').absolutePath
final boolean banjoProbe = (project.findProperty('banjoProbe') ?: 'false').toString().toBoolean()
// Backwards-compatible alias: the old -PbanjoDevFull=true mode meant "full runtime plus bundled dev ROMs".
final boolean banjoBundleDevRoms = (project.findProperty('banjoBundleDevRoms') ?: project.findProperty('banjoDevFull') ?: 'false').toString().toBoolean()
final boolean banjoRuntimeApk = !banjoProbe
final boolean banjoNativeOptimized = (project.findProperty('banjoNativeOptimized') ?: (banjoRuntimeApk ? 'true' : 'false')).toString().toBoolean()
final boolean banjoDualScreenDebug = (project.findProperty('banjoDualScreenDebug') ?: 'false').toString().toBoolean()
final String banjoVersionName = System.getenv('BANJO_ANDROID_VERSION_NAME') ?: (banjoProbe ? '0.1.0-android-sdl-probe' : (banjoBundleDevRoms ? '0.1.0-android-dev-roms' : '0.1.0-android-runtime'))
final int banjoVersionCode = (System.getenv('BANJO_ANDROID_VERSION_CODE') ?: project.findProperty('banjoVersionCode') ?: '2').toString().toInteger()
final String releaseStoreFile = System.getenv('BANJO_ANDROID_KEYSTORE_FILE')
final String releaseStorePassword = System.getenv('BANJO_ANDROID_KEYSTORE_PASSWORD')
final String releaseKeyAlias = System.getenv('BANJO_ANDROID_KEY_ALIAS')
final String releaseKeyPassword = System.getenv('BANJO_ANDROID_KEY_PASSWORD') ?: releaseStorePassword
final boolean hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
final boolean banjoAllowUnsignedRelease = (project.findProperty('banjoAllowUnsignedRelease') ?: 'false').toString().toBoolean()
final File generatedJniLibsDir = layout.buildDirectory.dir('generated/jniLibs').get().asFile
final File generatedProgramAssetsDir = layout.buildDirectory.dir('generated/programAssets').get().asFile
final File generatedDevRomAssetsDir = layout.buildDirectory.dir('generated/devRomAssets').get().asFile

android {
    namespace 'io.github.banjorecomp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aure.banjorecomp'
        minSdk 24
        targetSdk 36
        versionCode banjoVersionCode
        versionName banjoVersionName
        buildConfigField 'boolean', 'BANJO_DUAL_SCREEN_DEBUG', banjoDualScreenDebug.toString()
        buildConfigField 'boolean', 'BANJO_BUNDLE_DEV_ROMS', banjoBundleDevRoms.toString()

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                arguments \
                    "-DANDROID_PLATFORM=android-24", \
                    "-DSDL2_DIR=${sdl2Prefix}/lib/cmake/SDL2", \
                    "-DCMAKE_PREFIX_PATH=${sdl2Prefix};${freetypePrefix}", \
                    "-DFREETYPE_LIBRARY=${freetypePrefix}/lib/libfreetype.a", \
                    "-DFREETYPE_INCLUDE_DIRS=${freetypePrefix}/include/freetype2", \
                    "-DZSTD_BUILD_PROGRAMS=OFF", \
                    "-DZSTD_BUILD_TESTS=OFF", \
                    "-DZSTD_BUILD_DICTBUILDER=OFF", \
                    "-DBANJO_ANDROID_SHELL_ONLY=${banjoProbe ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_RENDERER_STUB=${banjoProbe ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_SDL_LIFECYCLE_PROBE=${banjoProbe ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_RUNTIME_APK=${banjoRuntimeApk ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_DEV_FULL_APK=${banjoBundleDevRoms ? 'ON' : 'OFF'}"
                if (banjoNativeOptimized) {
                    // Android's Gradle Debug variant drives CMake with CMAKE_BUILD_TYPE=Debug,
                    // which otherwise gives Clang no optimization flags. The full game is CPU
                    // heavy enough that an -O0 native build is not representative for perf testing.
                    // On Windows, -O2 on hundreds of large machine-generated files can OOM Ninja.
                    // Use -O1 for a better balance if memory issues persist.
                    cFlags '-O2', '-g', '-DNDEBUG'
                    cppFlags '-O2', '-g', '-DNDEBUG'
                }
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    ndkVersion '28.2.13676358'

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [generatedJniLibsDir]
            if (banjoRuntimeApk) {
                assets.srcDirs = banjoBundleDevRoms ? [generatedProgramAssetsDir, generatedDevRomAssetsDir] : [generatedProgramAssetsDir]
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

String findOnPath(String name) {
    final String pathValue = System.getenv('PATH') ?: ''
    final boolean isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    final List<String> candidates = isWindows ? [name, "${name}.exe", "${name}.cmd"] : [name]
    for (String pathEntry : pathValue.split(File.pathSeparator)) {
        if (!pathEntry) continue
        for (String candidateName : candidates) {
            File candidate = new File(pathEntry, candidateName)
            if (candidate.isFile() && candidate.canExecute()) return candidate.absolutePath
        }
    }
    return null
}

void requirePath(File path, String message) {
    if (!path.exists()) {
        throw new GradleException("${message}: ${path}")
    }
}

tasks.register('validateAndroidBuildEnvironment') {
    group = 'verification'
    description = 'Fail fast when the local Android SDK/NDK, native dependency prefixes, generated sources, or dev-ROM inputs are missing.'
    doLast {
        requirePath(file(androidSdk), 'ANDROID_HOME does not point at an Android SDK')
        requirePath(file(androidNdk), 'ANDROID_NDK_HOME does not point at the required Android NDK 28.2.13676358')
        requirePath(new File(androidNdk, 'build/cmake/android.toolchain.cmake'), 'Android NDK toolchain file is missing')
        final boolean isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        final String ndkHostArch = isWindows ? 'windows-x86_64' : 'linux-x86_64'
        final String ldLldBin = isWindows ? 'ld.lld.exe' : 'ld.lld'
        requirePath(new File(androidNdk, "toolchains/llvm/prebuilt/${ndkHostArch}/bin/${ldLldBin}"), "Android NDK ${ldLldBin} is missing")
        requirePath(new File(sdl2Prefix, 'lib/cmake/SDL2'), 'BANJO_ANDROID_SDL2_PREFIX is missing SDL2 CMake config')
        requirePath(new File(sdl2Prefix, 'lib/libSDL2.so'), 'BANJO_ANDROID_SDL2_PREFIX is missing libSDL2.so for packaging')
        requirePath(new File(freetypePrefix, 'include/freetype2'), 'BANJO_ANDROID_FREETYPE_PREFIX is missing Freetype headers')
        requirePath(new File(freetypePrefix, 'lib/libfreetype.a'), 'BANJO_ANDROID_FREETYPE_PREFIX is missing static Freetype library')

        if (!banjoProbe) {
            requirePath(new File(rootProject.projectDir.parentFile, 'RecompiledFuncs'), 'Runtime APK builds need generated RecompiledFuncs sources; run tools/ci/prepare_android_generated_sources.sh first')
            if (fileTree(new File(rootProject.projectDir.parentFile, 'RecompiledFuncs')) { include '*.c', '*.cpp' }.isEmpty()) {
                throw new GradleException('Runtime APK builds need RecompiledFuncs/*.c or RecompiledFuncs/*.cpp; run tools/ci/prepare_android_generated_sources.sh first')
            }
            requirePath(new File(rootProject.projectDir.parentFile, 'rsp/n_aspMain.cpp'), 'Runtime APK builds need generated rsp/n_aspMain.cpp; run tools/ci/prepare_android_generated_sources.sh first')
            requirePath(new File(rootProject.projectDir.parentFile, 'RecompiledPatches/patches.c'), 'Runtime APK builds need generated RecompiledPatches/patches.c; run tools/ci/prepare_android_generated_sources.sh first')
            // clang and ld.lld are only needed to (re)build patches/patches.bin via the patches Makefile.
            // Skip this check when patches.bin already exists — CMake will not invoke the patches build step.
            final boolean patchesBinExists = new File(rootProject.projectDir.parentFile, 'patches/patches.bin').exists()
            if (!patchesBinExists) {
                if (findOnPath('clang') == null) {
                    throw new GradleException('Runtime patch/source regeneration expects host clang on PATH; on Linux install clang via your package manager and prefer /usr/lib/llvm-XX/bin, on Windows ensure the NDK toolchain bin is on PATH')
                }
                if (findOnPath('ld.lld') == null) {
                    throw new GradleException('Runtime patch/source regeneration expects host ld.lld on PATH; on Linux install lld via your package manager (or symlink ld.lld to the versioned binary), on Windows ensure the NDK toolchain bin is on PATH')
                }
            }
        }

        if (banjoBundleDevRoms) {
            requirePath(file(bundledBaserom), 'Dev-ROM APK builds need a local baserom; set BANJO_ANDROID_BASEROM or BANJO_ANDROID_DEV_ROM_DIR')
            requirePath(file(bundledDecompressedRom), 'Dev-ROM APK builds need a local decompressed ROM; set BANJO_ANDROID_DECOMPRESSED_ROM or BANJO_ANDROID_DEV_ROM_DIR')
        }
    }
}

tasks.register('copySdl2JniLib', Copy) {
    dependsOn tasks.named('validateAndroidBuildEnvironment')
    from("${sdl2Prefix}/lib/libSDL2.so")
    into(new File(generatedJniLibsDir, 'arm64-v8a'))
}

if (banjoRuntimeApk) {
    tasks.register('copyProgramAssets', Copy) {
        dependsOn tasks.named('validateAndroidBuildEnvironment')
        doFirst {
            delete generatedProgramAssetsDir
        }
        from('../../assets') {
            into('program/assets')
        }
        from('../../recompcontrollerdb.txt') {
            into('program')
        }
        into(generatedProgramAssetsDir)
    }
}

if (banjoBundleDevRoms) {
    tasks.register('copyDevRomAssets', Copy) {
        dependsOn tasks.named('validateAndroidBuildEnvironment')
        doFirst {
            delete generatedDevRomAssetsDir
        }
        from(bundledBaserom) {
            into('program/dev-roms')
        }
        from(bundledDecompressedRom) {
            into('program/dev-roms')
        }
        into(generatedDevRomAssetsDir)
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('copySdl2JniLib')
    if (banjoRuntimeApk) {
        dependsOn tasks.named('copyProgramAssets')
    }
    if (banjoBundleDevRoms) {
        dependsOn tasks.named('copyDevRomAssets')
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    final boolean assemblingRelease = taskGraph.allTasks.any { it.name == 'assembleRelease' }
    if (banjoRuntimeApk && assemblingRelease && !hasReleaseSigning && !banjoAllowUnsignedRelease) {
        throw new GradleException('Runtime release APKs must be signed. Set BANJO_ANDROID_KEYSTORE_FILE, BANJO_ANDROID_KEYSTORE_PASSWORD, BANJO_ANDROID_KEY_ALIAS, and optionally BANJO_ANDROID_KEY_PASSWORD; or pass -PbanjoAllowUnsignedRelease=true for local non-distributable smoke builds only.')
    }
}
