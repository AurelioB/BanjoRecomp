plugins {
    id 'com.android.application'
}

final String homeDir = System.getenv('HOME') ?: System.getProperty('user.home')
final String androidSdk = System.getenv('ANDROID_HOME') ?: "${homeDir}/Android/Sdk"
final String androidNdk = System.getenv('ANDROID_NDK_HOME') ?: "${androidSdk}/ndk/28.2.13676358"
final String sdl2Prefix = System.getenv('BANJO_ANDROID_SDL2_PREFIX') ?: "${homeDir}/Android/prefixes/SDL2-2.32.10-android-arm64"
final String freetypePrefix = System.getenv('BANJO_ANDROID_FREETYPE_PREFIX') ?: "${homeDir}/Android/prefixes/freetype-2.13.3-android-arm64"
final boolean banjoProbe = (project.findProperty('banjoProbe') ?: 'false').toString().toBoolean()
// Backwards-compatible alias: the old -PbanjoDevFull=true mode meant "full runtime plus bundled dev ROMs".
final boolean banjoBundleDevRoms = (project.findProperty('banjoBundleDevRoms') ?: project.findProperty('banjoDevFull') ?: 'false').toString().toBoolean()
final boolean banjoRuntimeApk = !banjoProbe
final boolean banjoNativeOptimized = (project.findProperty('banjoNativeOptimized') ?: (banjoRuntimeApk ? 'true' : 'false')).toString().toBoolean()
final String banjoVersionName = System.getenv('BANJO_ANDROID_VERSION_NAME') ?: (banjoProbe ? '0.1.0-android-sdl-probe' : (banjoBundleDevRoms ? '0.1.0-android-dev-roms' : '0.1.0-android-runtime'))
final int banjoVersionCode = (System.getenv('BANJO_ANDROID_VERSION_CODE') ?: project.findProperty('banjoVersionCode') ?: '1').toString().toInteger()
final String releaseStoreFile = System.getenv('BANJO_ANDROID_KEYSTORE_FILE')
final String releaseStorePassword = System.getenv('BANJO_ANDROID_KEYSTORE_PASSWORD')
final String releaseKeyAlias = System.getenv('BANJO_ANDROID_KEY_ALIAS')
final String releaseKeyPassword = System.getenv('BANJO_ANDROID_KEY_PASSWORD') ?: releaseStorePassword
final boolean hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
final boolean banjoAllowUnsignedRelease = (project.findProperty('banjoAllowUnsignedRelease') ?: 'false').toString().toBoolean()
final File generatedJniLibsDir = layout.buildDirectory.dir('generated/jniLibs').get().asFile
final File generatedProgramAssetsDir = layout.buildDirectory.dir('generated/programAssets').get().asFile
final File generatedDevRomAssetsDir = layout.buildDirectory.dir('generated/devRomAssets').get().asFile

android {
    namespace 'io.github.banjorecomp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aure.banjorecomp'
        minSdk 24
        targetSdk 36
        versionCode banjoVersionCode
        versionName banjoVersionName

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                arguments \
                    "-DANDROID_PLATFORM=android-24", \
                    "-DSDL2_DIR=${sdl2Prefix}/lib/cmake/SDL2", \
                    "-DCMAKE_PREFIX_PATH=${sdl2Prefix};${freetypePrefix}", \
                    "-DFREETYPE_LIBRARY=${freetypePrefix}/lib/libfreetype.a", \
                    "-DFREETYPE_INCLUDE_DIRS=${freetypePrefix}/include/freetype2", \
                    "-DZSTD_BUILD_PROGRAMS=OFF", \
                    "-DZSTD_BUILD_TESTS=OFF", \
                    "-DZSTD_BUILD_DICTBUILDER=OFF", \
                    "-DBANJO_ANDROID_SHELL_ONLY=${banjoProbe ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_RENDERER_STUB=${banjoProbe ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_SDL_LIFECYCLE_PROBE=${banjoProbe ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_RUNTIME_APK=${banjoRuntimeApk ? 'ON' : 'OFF'}", \
                    "-DBANJO_ANDROID_DEV_FULL_APK=${banjoBundleDevRoms ? 'ON' : 'OFF'}"
                if (banjoNativeOptimized) {
                    // Android's Gradle Debug variant drives CMake with CMAKE_BUILD_TYPE=Debug,
                    // which otherwise gives Clang no optimization flags. The full game is CPU
                    // heavy enough that an -O0 native build is not representative for perf testing.
                    cFlags '-O2', '-g', '-DNDEBUG'
                    cppFlags '-O2', '-g', '-DNDEBUG'
                }
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    ndkVersion '28.2.13676358'

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [generatedJniLibsDir]
            if (banjoRuntimeApk) {
                assets.srcDirs = banjoBundleDevRoms ? [generatedProgramAssetsDir, generatedDevRomAssetsDir] : [generatedProgramAssetsDir]
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

tasks.register('copySdl2JniLib', Copy) {
    from("${sdl2Prefix}/lib/libSDL2.so")
    into(new File(generatedJniLibsDir, 'arm64-v8a'))
}

if (banjoRuntimeApk) {
    tasks.register('copyProgramAssets', Copy) {
        doFirst {
            delete generatedProgramAssetsDir
        }
        from('../../assets') {
            into('program/assets')
        }
        from('../../recompcontrollerdb.txt') {
            into('program')
        }
        into(generatedProgramAssetsDir)
    }
}

if (banjoBundleDevRoms) {
    tasks.register('copyDevRomAssets', Copy) {
        doFirst {
            delete generatedDevRomAssetsDir
        }
        from('../../lib/bk-decomp/baserom.us.v10.z64') {
            into('program/dev-roms')
        }
        from('../../banjo.us.v10.decompressed.z64') {
            into('program/dev-roms')
        }
        into(generatedDevRomAssetsDir)
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('copySdl2JniLib')
    if (banjoRuntimeApk) {
        dependsOn tasks.named('copyProgramAssets')
    }
    if (banjoBundleDevRoms) {
        dependsOn tasks.named('copyDevRomAssets')
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    final boolean assemblingRelease = taskGraph.allTasks.any { it.name == 'assembleRelease' }
    if (banjoRuntimeApk && assemblingRelease && !hasReleaseSigning && !banjoAllowUnsignedRelease) {
        throw new GradleException('Runtime release APKs must be signed. Set BANJO_ANDROID_KEYSTORE_FILE, BANJO_ANDROID_KEYSTORE_PASSWORD, BANJO_ANDROID_KEY_ALIAS, and optionally BANJO_ANDROID_KEY_PASSWORD; or pass -PbanjoAllowUnsignedRelease=true for local non-distributable smoke builds only.')
    }
}
